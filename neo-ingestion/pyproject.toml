[project]
name = "neo-ingest"
version = "0.1.0"
description = "NEO Quant Lab — CSV to Supabase ingestion pipeline for historical lottery draws"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "supabase>=2.0",
    "pandas>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
neo-ingest = "neo_ingest.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
